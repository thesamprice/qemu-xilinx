[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rtqcov"
description = "Host-side tooling for RTQCov QEMU code-coverage artifacts"
readme = "README.rtqcov.md"
requires-python = ">=3.8"
dynamic = ["version"]
dependencies = []

[project.scripts]
rtqcov = "rtqcov.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["rtqcov"]

[tool.setuptools.dynamic]
version = {attr = "rtqcov.__version__"}
